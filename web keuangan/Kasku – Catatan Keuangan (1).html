<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KasMawrennzz – Catatan Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.pad button{height:50px;border:0;border-radius:14px;background:var(--bg);font-size:20px;font-weight:700;color:var(--tx)}

@media print{nav,#ov,#toast,.noprint{display:none!important}body{padding:0}}
</style></head><body><main id="v"></main><nav id="nav"></nav><div id="ov"></div><div id="toast"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);

const today=ago(0),cm=today.slice(0,7);

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum=(a,f)=>a.reduce((s,t)=>s+f(t),0),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

const P={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',tx:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',goal:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/>',rep:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',plus:'<path d="M12 5v14M5 12h14"/>',eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>',off:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><path d="M3 3l18 18"/>',reset:'<path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.6L3 8"/><path d="M3 3v5h5"/>',minus:'<path d="M5 12h14"/>',trash:'<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>'};
const Store={k:'kasku.v2',load(){try{return JSON.parse(localStorage.getItem(this.k))}catch(e){return null}},save(s){try{localStorage.setItem(this.k,JSON.stringify(s))}catch(e){}}};
const CATS={food:['🍜','Makan'],coffee:['☕','Kopi'],trans:['🚌','Transport'],shop:['🛍️','Belanja'],bill:['🧾','Tagihan'],fun:['🎬','Hiburan'],health:['💊','Kesehatan'],other:['📦','Lainnya'],salary:['💼','Gaji'],side:['💰','Sampingan'],gift:['🎁','Hadiah'],save:['🐷','Tabungan'],tf:['🔁','Transfer']};
const OUT=['food','coffee','trans','shop','bill','fun','health','other'],INC=['salary','side','gift','other'],COL=['#F87171','#FBBF24','#818CF8'];
function seed(){const T=[[21,'in',8500000,'salary','bca','Gaji November'],[20,'out',1500000,'bill','bca','Kos bulanan'],[19,'out',185000,'bill','bca','Listrik dan internet'],[18,'out',32000,'food','gopay','Makan siang'],[17,'out',27000,'coffee','gopay','Kopi susu'],[16,'out',215000,'shop','bca','Kaos dan celana'],[15,'in',750000,'side','bca','Proyek desain'],[14,'out',45000,'trans','gopay','Ojol pulang'],[13,'out',68000,'food','cash','Makan malam'],[12,'out',27000,'coffee','gopay','Kopi'],[11,'out',120000,'fun','gopay','Nonton bioskop'],[10,'out',35000,'food','cash','Nasi goreng'],[9,'out',90000,'health','cash','Vitamin'],[8,'out',52000,'food','gopay','Makan siang'],[7,'tf',500000,'','gopay','Tarik tunai','cash'],[6,'out',38000,'food','gopay','Ayam geprek'],[5,'out',30000,'trans','gopay','Ojol'],[4,'out',27000,'coffee','gopay','Kopi'],[3,'out',24000,'food','cash','Sarapan'],[2,'out',150000,'shop','bca','Belanja bulanan'],[1,'out',41000,'food','gopay','Makan malam'],[0,'out',17000,'coffee','gopay','Kopi pagi']];
return{wallets:[{id:'cash',n:'Tunai',i:'💵',init:400000},{id:'gopay',n:'E-Wallet',i:'📱',init:350000}],tx:T.map((r,i)=>({id:'s'+i,type:r[1],a:r[2],c:r[3],w:r[4]=='bca'?'gopay':r[4],n:r[5],to:r[6],d:ago(r[0])})),goals:[{id:'g1',n:'Tabungan ODL',i:'🎯',c:'#8B5CF6',t:5000000,saved:2100000,due:ago(-75)},{id:'g2',n:'Tabungan HP',i:'📱',c:'#0EA5E9',t:8000000,saved:3200000,due:ago(-120)},{id:'g3',n:'Dana Darurat',i:'🛟',c:'#10B981',t:20000000,saved:7500000,due:ago(-300)},{id:'g4',n:'Liburan Bali',i:'✈️',c:'#F59E0B',t:6000000,saved:1800000,due:ago(-150)},{id:'g5',n:'Beli Laptop',i:'💻',c:'#EC4899',t:15000000,saved:2500000,due:ago(-240)}],budgets:{food:1200000,coffee:150000,trans:150000,shop:400000,fun:100000},set:{hide:false,rem:true,ru:true,step:5000,rug:'g1'}}}
let S=Store.load()||seed(),T='home',F,Q={q:'',c:'',m:''};
const save=()=>Store.save(S);
const bal=id=>{let b=S.wallets.find(w=>w.id==id).init;S.tx.forEach(t=>{if(t.type=='in'&&t.w==id)b+=t.a;if(t.type=='out'&&t.w==id)b-=t.a;if(t.type=='tf'){if(t.w==id)b-=t.a;if(t.to==id)b+=t.a}});return b};
const wn=id=>(S.wallets.find(w=>w.id==id)||{}).n||'';
const mm=n=>S.set.hide?'Rp ••••••':rp(n);
const mtx=()=>S.tx.filter(t=>t.d.slice(0,7)==cm);
const spent=c=>sum(mtx().filter(t=>t.type=='out'&&t.c==c),t=>t.a);
const inc=()=>sum(mtx().filter(t=>t.type=='in'&&t.c!='save'),t=>t.a),exp=()=>sum(mtx().filter(t=>t.type=='out'&&t.c!='save'),t=>t.a);
const sorted=()=>[...S.tx].reverse().sort((x,y)=>y.d<x.d?-1:y.d>x.d?1:0);
const dl=d=>d==today?'Hari ini':d==ago(1)?'Kemarin':new Date(d+'T00:00').toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
const bcol=p=>p>1?'var(--r)':p>=.8?'var(--y)':'var(--g)';
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.',',')+' jt':Math.round(n/1e3)+' rb';
function row(t,del){const c=t.type=='tf'?CATS.tf:CATS[t.c]||CATS.other,bg=t.type=='in'?'var(--gs)':t.type=='out'?'var(--rs)':'var(--line)';
return `<div class="row tx"><div class="ico" style="background:${bg}">${c[0]}</div><div style="flex:1;min-width:0"><div class="t">${esc(t.n||c[1])}</div><div class="mut">${t.type=='tf'?wn(t.w)+' → '+wn(t.to):c[1]+' · '+wn(t.w)}</div></div><div style="text-align:right"><b class="${t.type}">${t.type=='in'?'+':t.type=='out'?'−':''}${rp(t.a)}</b><div class="mut">${del?`<a data-a="del" data-id="${t.id}">Hapus</a>`:dl(t.d)}</div></div></div>`}
function vHome(){const bs=Object.keys(S.budgets).filter(c=>spent(c)/S.budgets[c]>=.8).length,late=S.set.rem&&new Date().getHours()>=19&&!S.tx.some(t=>t.d==today);
return `<div class="row sp"><div><div class="mut">Halo Maww 👋</div><h1>Beranda</h1></div><button class="eye" data-a="reset" aria-label="Reset data" title="Reset data" style="width:42px;height:42px;border-radius:50%;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;color:var(--tx)">${ic(P.reset)}</button></div>
<div class="card"><div class="row sp"><span class="mut">Total saldo</span><button class="eye" data-a="eye" aria-label="Tampilkan atau sembunyikan saldo">${ic(S.set.hide?P.off:P.eye)}</button></div><div class="big">${mm(S.wallets.reduce((s,w)=>s+bal(w.id),0))}</div><div class="chips">${S.wallets.map(w=>`<div class="chip">${w.i} ${w.n}<b>${mm(bal(w.id))}</b></div>`).join('')}</div></div>
<div class="grid2"><div class="card"><div class="mut">Pemasukan bulan ini</div><div class="n2 in">${mm(inc())}</div></div><div class="card"><div class="mut">Pengeluaran bulan ini</div><div class="n2 out">${mm(exp())}</div></div></div>
${late?'<div class="tag">🌙 Sudah catat transaksi hari ini? Ketuk tombol + untuk mencatat.</div>':''}${bs?`<div class="tag" data-a="tab" data-t="rep" style="cursor:pointer">⚠️ ${bs} anggaran hampir atau sudah melewati batas. Lihat di Laporan.</div>`:''}
<div class="row sp"><h3>Transaksi terakhir</h3><a data-a="tab" data-t="tx">Lihat semua</a></div><div class="card" style="padding:4px 16px">${sorted().slice(0,5).map(t=>row(t)).join('')||'<p class="mut">Belum ada transaksi. Ketuk + untuk memulai.</p>'}</div>`}
function list(){const a=sorted().filter(t=>(!Q.c||t.c==Q.c||(Q.c=='tf'&&t.type=='tf'))&&(!Q.m||t.d.slice(0,7)==Q.m)&&(!Q.q||((t.n||'')+' '+(CATS[t.c]||[0,''])[1]).toLowerCase().includes(Q.q.toLowerCase())));
if(!a.length)return '<p class="mut" style="text-align:center;padding:30px">Tidak ada transaksi yang cocok. Coba ubah pencarian atau filter.</p>';
const g={};a.forEach(t=>(g[t.d]=g[t.d]||[]).push(t));return Object.keys(g).map(d=>`<div class="mut" style="margin:12px 4px 6px">${dl(d)}</div><div class="card" style="padding:4px 16px;margin:0">${g[d].map(t=>row(t,1)).join('')}</div>`).join('')}
function vTx(){return `<h1>Transaksi</h1><input id="q" placeholder="Cari catatan atau kategori" value="${esc(Q.q)}"><div class="grid2" style="margin:10px 0"><select id="fc"><option value="">Semua kategori</option>${Object.keys(CATS).map(k=>`<option value="${k}" ${Q.c==k?'selected':''}>${CATS[k][0]} ${CATS[k][1]}</option>`).join('')}</select><input type="month" id="fm" value="${Q.m}"></div><div id="list"></div>`}
function vGoal(){const st=S.set.step,o=mtx().filter(t=>t.type=='out'&&t.c!='save'),ex=sum(o,t=>Math.ceil(t.a/st)*st-t.a);
return `<h1>Tabungan</h1><div class="card"><div class="mut">Total celengan</div><div class="big in" style="margin-bottom:0">${mm(sum(S.goals,g=>g.saved))}</div></div>
${S.goals.map(g=>{const p=Math.min(1,g.saved/g.t),days=Math.ceil((new Date(g.due+'T00:00')-new Date(today+'T00:00'))/864e5),rem=Math.max(0,g.t-g.saved),pd=rem/Math.max(days,1);
return `<div class="card" style="border-top:4px solid ${g.c||'#10B981'}"><div class="row"><div class="ico" style="background:${g.c||'#10B981'}22">${g.i}</div><div style="flex:1"><b>${esc(g.n)}</b><div class="mut">Tenggat ${new Date(g.due+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}</div></div><div class="row" style="gap:4px"><button class="ib" data-a="gtake" data-id="${g.id}" aria-label="Kurangi tabungan" title="Kurangi">${ic(P.minus)}</button><button class="ib" style="background:${g.c||'#10B981'};color:#fff" data-a="gfund" data-id="${g.id}" aria-label="Tambah tabungan" title="Tambah">${ic(P.plus)}</button><button class="ib" style="color:var(--r)" data-a="gdel" data-id="${g.id}" aria-label="Hapus tabungan" title="Hapus">${ic(P.trash)}</button></div></div>
<div class="bar"><i style="width:${p*100}%;background:${g.c||'#10B981'}"></i></div><div class="row sp mut"><span>${rp(g.saved)} dari ${rp(g.t)}</span><b>${Math.round(p*100)}%</b></div>
<div class="tag" style="margin:10px 0 0;background:${g.c||'#10B981'}1f">${rem==0?'🎉 Target tercapai!':days<=0?'Tenggat sudah lewat. Ubah target atau lanjut isi celengan.':`Sisihkan <b>${rp(pd)}/hari</b> atau <b>${rp(pd*7)}/minggu</b> agar tepat waktu.`}</div></div>`}).join('')}
<button class="btn ghost" style="width:100%;margin-bottom:14px" data-a="gadd">+ Celengan baru</button>
<div class="card"><div class="row sp"><b>Sisa kembalian</b><button class="btn sm ${S.set.ru?'':'ghost'}" data-a="ru">${S.set.ru?'Aktif':'Mati'}</button></div><p class="mut">Setiap jajan dibulatkan ke atas, selisihnya masuk celengan. Contoh: Rp17.000 jadi Rp20.000, Rp3.000 ditabung.</p>
<div class="seg">${[1000,5000,10000].map(v=>`<button class="${st==v?'on':''}" data-a="step" data-v="${v}">${rp(v)}</button>`).join('')}</div>
<label class="mut">Masuk ke celengan</label><select id="rug">${S.goals.map(g=>`<option value="${g.id}" ${S.set.rug==g.id?'selected':''}>${g.i} ${esc(g.n)}</option>`).join('')}</select>
<div class="tag" style="margin:12px 0 0">Simulasi bulan ini: dari ${o.length} pengeluaran, kamu bisa menabung <b>${rp(ex)}</b>.</div></div>`}
function insights(){const r=[],rng=(a,b)=>sum(S.tx.filter(t=>t.type=='out'&&t.c=='food'&&t.d>=ago(a)&&t.d<=ago(b)),t=>t.a),cur=rng(6,0),pv=rng(13,7);
if(pv>0){const p=Math.round((cur-pv)/pv*100);r.push(['var(--g)',`Pengeluaran makanmu 7 hari terakhir ${Math.abs(p)}% ${p<=0?'lebih hemat dari minggu lalu. Mantap!':'lebih boros dari minggu lalu. Yuk dikurangi pelan-pelan.'}`])}
const c=cats();if(c.length)r.push(['#F87171',`Pengeluaran terbesarmu bulan ini: ${CATS[c[0][0]][1]} (${Math.round(c[0][1]/exp()*100)}% dari total).`]);
Object.keys(S.budgets).forEach(k=>{const l=S.budgets[k],s=spent(k);if(s>l)r.push(['var(--r)',`Anggaran ${CATS[k][1]} lewat ${rp(s-l)} dari batas.`]);else if(s/l>=.8)r.push(['var(--y)',`Anggaran ${CATS[k][1]} tinggal ${rp(l-s)} lagi.`])});
if(inc()>exp())r.push(['var(--g)',`Kamu masih menyisakan ${rp(inc()-exp())} (${Math.round((inc()-exp())/inc()*100)}%) dari pemasukan bulan ini.`]);return r}
const cats=()=>Object.entries(mtx().filter(t=>t.type=='out'&&t.c!='save').reduce((o,t)=>(o[t.c]=(o[t.c]||0)+t.a,o),{})).sort((a,b)=>b[1]-a[1]).slice(0,3);
function vRep(){const c=cats(),tot=exp();let off=25;
const dn=c.length?`<svg viewBox="0 0 42 42" width="180" height="180" style="display:block;margin:0 auto"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--line)" stroke-width="5"/>${c.map(([k,v],i)=>{const p=v/tot*100,s=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${COL[i]}" stroke-width="5" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;return s}).join('')}<text x="21" y="20" text-anchor="middle" font-size="2.8" fill="var(--mut)">Total keluar</text><text x="21" y="25" text-anchor="middle" font-size="4.2" font-weight="800" fill="var(--tx)">${short(tot)}</text></svg>`+c.map(([k,v],i)=>`<div class="row sp" style="margin-top:8px"><span class="row" style="gap:8px"><i class="dot" style="background:${COL[i]};margin:0"></i>${CATS[k][0]} ${CATS[k][1]}</span><b>${rp(v)} <span class="mut">${Math.round(v/tot*100)}%</span></b></div>`).join(''):'<p class="mut">Belum ada pengeluaran bulan ini.</p>';
return `<div class="mut">${new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'})}</div><h1>Laporan</h1>
<div class="card"><b>3 pengeluaran terbesar</b><div style="height:10px"></div>${dn}</div>
<div class="card"><b>Insight</b>${insights().map(i=>`<div class="ins"><i class="dot" style="background:${i[0]}"></i><span>${i[1]}</span></div>`).join('')||'<p class="mut">Catat beberapa transaksi dulu untuk melihat insight.</p>'}</div>
<div class="card"><b>Anggaran bulanan</b><div class="mut">Ketuk untuk mengubah batas</div>${OUT.filter(k=>k!='other').map(k=>{const l=S.budgets[k],s=spent(k);if(!l)return `<div class="bud row sp" data-a="bud" data-c="${k}"><span>${CATS[k][0]} ${CATS[k][1]}</span><span class="mut">Atur batas ›</span></div>`;const p=s/l;return `<div class="bud" data-a="bud" data-c="${k}"><div class="row sp"><span>${CATS[k][0]} ${CATS[k][1]}</span><span class="mut">${rp(s)} / ${rp(l)}</span></div><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:${bcol(p)}"></i></div><div class="mut">${p>1?'Over anggaran':p>=.8?'Mendekati batas':'Aman'}</div></div>`}).join('')}</div>
<div class="card noprint"><div class="row sp"><div><b>Pengingat malam</b><div class="mut">Ingatkan catat transaksi jam 20.00</div></div><button class="btn sm ${S.set.rem?'':'ghost'}" data-a="rem">${S.set.rem?'Aktif':'Mati'}</button></div>
<div class="grid2" style="margin-top:14px"><button class="btn ghost" data-a="csv">Ekspor CSV</button><button class="btn ghost" data-a="print">Cetak / PDF</button></div><p class="mut" style="margin:12px 0 0">Data tersimpan di perangkat ini. <a data-a="reset">Reset data</a></p></div>`}
function render(){$('#v').innerHTML={home:vHome,tx:vTx,goal:vGoal,rep:vRep}[T]();document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==T));if(T=='tx')$('#list').innerHTML=list()}
const ov=h=>{$('#ov').innerHTML='<div class="sheet">'+h+'</div>';$('#ov').classList.add('on')},close=()=>$('#ov').classList.remove('on');
let tt;const toast=m=>{const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)};
function form(title,fs,ok){ov(`<h3 style="margin-top:0">${title}</h3>${fs.map(f=>`<label class="mut">${f.l}</label>${f.t=='s'?`<select id="f_${f.k}">${f.o.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`:`<input id="f_${f.k}" ${f.t=='$'?'inputmode="numeric" data-m placeholder="0"':f.t=='d'?'type="date"':''} value="${f.v||''}">`}`).join('')}<div class="row" style="margin-top:18px"><button class="btn ghost" data-a="close">Batal</button><button class="btn" id="ok" style="flex:1">Simpan</button></div>`);
$('#ok').onclick=()=>{const v={};fs.forEach(f=>{const e=$('#f_'+f.k);v[f.k]=f.t=='$'?+e.value.replace(/\D/g,''):e.value});if(ok(v)!==false)close()}}
function sheetTx(){const cs=F.type=='out'?OUT:INC,wo=s=>S.wallets.map(w=>`<option value="${w.id}" ${s==w.id?'selected':''}>${w.i} ${w.n}</option>`).join('');
ov(`<div class="seg">${[['out','Pengeluaran'],['in','Pemasukan'],['tf','Transfer']].map(([k,l])=>`<button class="${F.type==k?'on':''}" data-a="ft" data-v="${k}">${l}</button>`).join('')}</div>
<div class="amt ${F.type}"><small>Rp</small><span id="amt">${F.a?(+F.a).toLocaleString('id-ID'):'0'}</span></div>
${F.type=='tf'?'':`<div class="cats">${cs.map(k=>`<button class="cat ${F.c==k?'on':''}" data-a="fc" data-v="${k}"><b>${CATS[k][0]}</b>${CATS[k][1]}</button>`).join('')}</div>`}
<div class="grid2" style="margin:12px 0 8px"><select id="sw">${wo(F.w)}</select>${F.type=='tf'?`<select id="st">${wo(F.to)}</select>`:`<input type="date" id="sd" value="${F.d}">`}</div>
${F.type=='tf'?`<input type="date" id="sd" value="${F.d}" style="margin-bottom:8px">`:''}<input id="sn" placeholder="Catatan singkat (opsional)" value="${esc(F.n)}">
${F.type=='out'&&S.goals.length?`<label class="row mut" style="gap:8px"><input type="checkbox" id="sru" style="width:auto" ${S.set.ru?'checked':''}>Bulatkan ke atas dan tabung sisanya (${rp(S.set.step)})</label>`:''}
<div class="pad">${[1,2,3,4,5,6,7,8,9,'000',0,'⌫'].map(k=>`<button data-a="k" data-v="${k}">${k}</button>`).join('')}</div><button class="btn" style="width:100%;font-size:16px" data-a="fs">Simpan transaksi</button>`)}
function saveTx(){const a=+F.a;if(!a)return toast('Isi nominal dulu ya');if(F.type=='tf'&&F.w==F.to)return toast('Pilih dua dompet yang berbeda');
const d=F.d||today;S.tx.push({id:uid(),type:F.type,a,c:F.c,w:F.w,to:F.to,n:F.n.trim(),d});let m='Tersimpan';
if(F.type=='out'&&S.set.ru&&S.goals.length){const st=S.set.step,x=Math.ceil(a/st)*st-a;if(x>0){const g=S.goals.find(g=>g.id==S.set.rug)||S.goals[0];g.saved+=x;S.tx.push({id:uid(),type:'out',a:x,c:'save',w:F.w,n:'Sisa kembalian ke '+g.n,d,g:g.id});m+=` · +${rp(x)} ke ${g.n}`}}
save();close();render();toast(m)}
function csv(){const r=[['Tanggal','Tipe','Kategori','Dompet','Ke dompet','Nominal','Catatan']].concat(sorted().map(t=>[t.d,{in:'Masuk',out:'Keluar',tf:'Transfer'}[t.type],t.type=='tf'?'Transfer':CATS[t.c][1],wn(t.w),wn(t.to),t.a,'"'+(t.n||'').replace(/"/g,'""')+'"']));return r.map(x=>x.join(',')).join('\n')}
const W=()=>S.wallets.map(w=>[w.id,w.i+' '+w.n]);
function act(a,d){switch(a){
case'tab':T=d.t;scrollTo(0,0);render();break;
case'eye':S.set.hide=!S.set.hide;save();render();break;
case'add':F={type:'out',a:'',c:'food',w:'cash',to:'gopay',n:'',d:today};sheetTx();break;
case'ft':F.type=d.v;F.c=d.v=='out'?'food':d.v=='in'?'salary':'';sheetTx();break;
case'fc':F.c=d.v;sheetTx();break;
case'k':if(d.v=='⌫')F.a=F.a.slice(0,-1);else if(F.a.length<11)F.a=(F.a+d.v).replace(/^0+/,'');$('#amt').textContent=F.a?(+F.a).toLocaleString('id-ID'):'0';break;
case'fs':saveTx();break;
case'del':{const t=S.tx.find(x=>x.id==d.id);if(t&&t.g){const g=S.goals.find(g=>g.id==t.g);if(g)g.saved=Math.max(0,g.saved+(t.type=='in'?t.a:-t.a))}S.tx=S.tx.filter(x=>x.id!=d.id);save();render();toast('Transaksi dihapus');break}
case'close':close();break;
case'gadd':form('Celengan baru',[{k:'n',l:'Nama celengan'},{k:'t',l:'Target nominal',t:'$'},{k:'d',l:'Tenggat',t:'d',v:ago(-90)},{k:'i',l:'Ikon',t:'s',o:['🎯','📱','🛟','💻','✈️','🏠','🚗','🎓'].map(x=>[x,x])},{k:'c',l:'Warna',t:'s',o:[['#8B5CF6','Ungu'],['#0EA5E9','Biru'],['#10B981','Hijau'],['#F59E0B','Oranye'],['#EC4899','Pink'],['#EF4444','Merah']]}],v=>{if(!v.n||!v.t||!v.d)return toast('Lengkapi nama, target, dan tenggat'),false;S.goals.push({id:uid(),n:v.n,i:v.i,c:v.c,t:v.t,saved:0,due:v.d});save();render()});break;
case'gfund':{const g=S.goals.find(x=>x.id==d.id);form('Isi '+esc(g.n),[{k:'a',l:'Nominal',t:'$'},{k:'w',l:'Ambil dari dompet',t:'s',o:W()}],v=>{if(!v.a)return toast('Isi nominalnya dulu'),false;g.saved+=v.a;S.tx.push({id:uid(),type:'out',a:v.a,c:'save',w:v.w,n:'Isi '+g.n,d:today,g:g.id});save();render();toast('Celengan bertambah '+rp(v.a))});break}
case'bud':{const c=d.c;form('Anggaran '+CATS[c][1],[{k:'l',l:'Batas per bulan (kosongkan untuk hapus)',t:'$',v:S.budgets[c]?S.budgets[c].toLocaleString('id-ID'):''}],v=>{v.l?S.budgets[c]=v.l:delete S.budgets[c];save();render()});break}
case'gtake':{const g=S.goals.find(x=>x.id==d.id);form('Kurangi '+esc(g.n),[{k:'a',l:'Nominal',t:'$'},{k:'w',l:'Masukkan ke dompet',t:'s',o:W()}],v=>{if(!v.a)return toast('Isi nominalnya dulu'),false;if(v.a>g.saved)return toast('Melebihi isi tabungan ('+rp(g.saved)+')'),false;g.saved-=v.a;S.tx.push({id:uid(),type:'in',a:v.a,c:'save',w:v.w,n:'Ambil dari '+g.n,d:today,g:g.id});save();render();toast('Tabungan berkurang '+rp(v.a))});break}
case'gdel':{const g=S.goals.find(x=>x.id==d.id);ov(`<h3 style="margin-top:0">Hapus ${esc(g.n)}?</h3><p class="mut">${g.saved?`Isi tabungan saat ini ${rp(g.saved)}. Mau dikembalikan ke dompet?`:'Tabungan ini masih kosong.'}</p>${g.saved?`<label class="mut">Kembalikan ke dompet</label><select id="gw">${W().map(o=>`<option value="${o[0]}">${o[1]}</option>`).join('')}</select><button class="btn" style="width:100%;margin-top:12px" data-a="gdel1" data-id="${g.id}" data-r="1">Hapus dan kembalikan ke dompet</button>`:''}<button class="btn" style="width:100%;margin-top:10px;background:var(--r)" data-a="gdel1" data-id="${g.id}">${g.saved?'Hapus saja, tanpa mengembalikan':'Hapus tabungan'}</button><button class="btn ghost" style="width:100%;margin-top:10px" data-a="close">Batal</button>`);break}
case'gdel1':{const g=S.goals.find(x=>x.id==d.id);if(d.r&&g.saved)S.tx.push({id:uid(),type:'in',a:g.saved,c:'save',w:$('#gw').value,n:'Tabungan '+g.n+' dibubarkan',d:today});S.tx.forEach(t=>{if(t.g==g.id)delete t.g});S.goals=S.goals.filter(x=>x.id!=g.id);if(S.set.rug==g.id)S.set.rug=(S.goals[0]||{}).id||'';save();close();render();toast('Tabungan dihapus');break}
case'step':S.set.step=+d.v;save();render();break;
case'ru':S.set.ru=!S.set.ru;save();render();break;
case'rem':S.set.rem=!S.set.rem;save();render();if(S.set.rem)try{Notification.requestPermission()}catch(e){};break;
case'csv':ov(`<h3 style="margin-top:0">Ekspor CSV</h3><p class="mut">Salin lalu tempel ke Excel atau Google Sheets.</p><textarea id="cv" rows="9" readonly>${esc(csv())}</textarea><div class="row" style="margin-top:14px"><button class="btn ghost" data-a="close">Tutup</button><button class="btn" id="cp" style="flex:1">Salin</button></div>`);$('#cp').onclick=()=>{const e=$('#cv');e.select();try{navigator.clipboard.writeText(e.value).then(()=>toast('CSV tersalin'),()=>document.execCommand('copy'))}catch(x){document.execCommand('copy');toast('CSV tersalin')}};break;
case'print':try{print()}catch(e){toast('Cetak tidak tersedia di sini')}break;
case'reset':ov(`<h3 style="margin-top:0">Reset data</h3><p class="mut">Semua catatan saat ini akan diganti dan tidak bisa dikembalikan. Pilih salah satu:</p><button class="btn" style="width:100%;background:var(--r)" data-a="r0">Mulai dari Rp0</button><p class="mut" style="margin:6px 0 14px">Saldo, transaksi, dan isi tabungan jadi 0. Nama celengan dan anggaran tetap ada.</p><button class="btn ghost" style="width:100%" data-a="r1">Kembalikan data contoh</button><p class="mut" style="margin:6px 0 14px">Kembali ke data awal seperti pertama kali dibuka.</p><button class="btn ghost" style="width:100%" data-a="close">Batal</button>`);break;
case'r0':{const b=seed();b.wallets.forEach(w=>w.init=0);b.tx=[];b.goals.forEach(g=>g.saved=0);S=b;save();close();T='home';render();toast('Semua data dimulai dari Rp0');break}
case'r1':S=seed();save();close();T='home';render();toast('Data contoh dikembalikan');break}}
document.addEventListener('click',e=>{if(e.target.id=='ov')return close();const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el.dataset)});
document.addEventListener('input',e=>{const t=e.target,i=t.id;if(t.dataset.m!==undefined){const d=t.value.replace(/\D/g,'').slice(0,12);t.value=d?(+d).toLocaleString('id-ID'):''}
if(i=='sn')F.n=t.value;else if(i=='sd')F.d=t.value;else if(i=='sw')F.w=t.value;else if(i=='st')F.to=t.value;else if(i=='sru'){S.set.ru=t.checked;save()}
else if(i=='rug'){S.set.rug=t.value;save()}else if(i=='q'||i=='fc'||i=='fm'){Q[{q:'q',fc:'c',fm:'m'}[i]]=t.value;$('#list').innerHTML=list()}});
$('#nav').innerHTML=[['home','Beranda'],['tx','Transaksi'],['add','Catat'],['goal','Tabungan'],['rep','Laporan']].map(([k,l])=>k=='add'?`<button class="fab" data-a="add" aria-label="Catat transaksi">${ic(P.plus)}<span>Catat</span></button>`:`<button data-a="tab" data-t="${k}">${ic(P[k])}<span>${l}</span></button>`).join('');
setInterval(()=>{const n=new Date();if(S.set.rem&&n.getHours()==20&&S.set.ln!=today){S.set.ln=today;save();toast('🌙 Sudah catat transaksi hari ini?');try{if(Notification.permission=='granted')new Notification('Kasku',{body:'Sudah catat transaksi hari ini?'})}catch(e){}}},30000);
render();
})();
</script></body></html>
